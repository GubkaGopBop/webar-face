<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <title>ПР3 — виртуальные 3D-очки</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
  {"imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.151.3/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.151.3/examples/jsm/",
    "mindar-face-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
  }}
  </script>
</head>
<body>
  <main id="camera" aria-label="WebAR сцена"></main>
  <header><span class="badge">WEBAR · ПРАКТИЧЕСКАЯ РАБОТА 3</span><h1>Виртуальные очки</h1><p id="status" role="status" aria-live="polite">Разрешите камеру и посмотрите прямо на экран.</p></header>
  <section class="controls" aria-label="Настройки фильтра">
    <div class="actions"><button id="start" disabled>Загрузка…</button><button id="stop" disabled>Остановить</button></div>
    <details><summary>Подогнать очки</summary>
      <label for="size">Размер <output id="size-value">1.00</output></label><input id="size" type="range" min="0.75" max="1.3" step="0.01" value="1">
      <label for="height">Высота <output id="height-value">0.06</output></label><input id="height" type="range" min="-0.1" max="0.2" step="0.01" value="0.06">
      <label for="depth">Отступ от лица <output id="depth-value">0.08</output></label><input id="depth" type="range" min="0.02" max="0.2" step="0.01" value="0.08">
      <label for="color">Цвет оправы</label><select id="color"><option value="#43ddd0">Бирюзовый</option><option value="#ffbd59">Золотой</option><option value="#ed80ff">Фиолетовый</option></select>
      <button id="reset" class="secondary">Сбросить настройки</button>
    </details>
    <p class="hint">Ровный свет · лицо целиком в кадре · плавные движения</p>
    <p id="privacy">Видео обрабатывается в браузере и не отправляется на сервер.</p>
  </section>
  <script type="module" src="./app.js"></script>
  <script>window.addEventListener('error', (event) => { if (event.target?.tagName === 'SCRIPT') document.getElementById('status').textContent = 'Не удалось загрузить приложение. Проверьте интернет и обновите страницу.'; }, true);</script>
</body>
</html>
