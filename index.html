<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <title>ПР3 — пиратская повязка</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
  {"imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.151.3/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.151.3/examples/jsm/",
    "mindar-face-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
  }}
  </script>
</head>
<body>
  <main id="camera" aria-label="WebAR сцена"></main>
  <header><h1>Пиратская повязка</h1></header>
  <section class="controls" aria-label="Управление камерой">
    <p id="status" role="status" aria-live="polite">Включите камеру — повязка появится на лице.</p>
    <button id="start" disabled>Загрузка…</button>
  </section>
  <script type="module" src="./app.js"></script>
  <script>window.addEventListener('error', (event) => { if (event.target?.tagName === 'SCRIPT') document.getElementById('status').textContent = 'Не удалось загрузить приложение. Проверьте интернет и обновите страницу.'; }, true);</script>
</body>
</html>
